server:
  port: 8080

spring:
  application:
    name: "shieldFlow"
  h2:
    console:
      enabled: true
      path: "/h2"

reactive:
  commons:
    kafka:
      app:
        connectionProperties:
          bootstrap-servers: "localhost:9092"

events:
  topics:
    transaction-received: "shieldflow.transaction.received"
  retry:
    max-attempts: 3
    delay-seconds: 2

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"