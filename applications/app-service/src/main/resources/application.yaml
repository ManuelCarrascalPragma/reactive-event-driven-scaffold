server:
  port: 8080

spring:
  application:
    name: "shield-flow"
  r2dbc:
    url: r2dbc:postgresql://localhost:5434/shieldflow_db
    username: postgres
    password: postgres
  sql:
    init:
      mode: never

adapters:
  r2dbc:
    host: localhost
    port: 5434
    database: shieldflow_db
    schema: public
    username: postgres
    password: postgres

reactive:
  commons:
    kafka:
      app:
        connectionProperties:
          bootstrap-servers: "localhost:9092"

events:
  topics:
    transaction-received: "shieldflow.transaction.received"
  retry:
    max-attempts: 3
    delay-seconds: 2

management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    reactor.kafka: DEBUG

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"